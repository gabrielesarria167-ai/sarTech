<!DOCTYPE html>

<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistenza</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="shortcut icon" type="image/x-icon" href="../sarTech.ico">
    <script src="../script.js" defer></script>
    <script src="../scripts/devices.js" defer></script>
    <script src="../scripts/assistenza.js" defer></script>

</head>

<body id="assistenza">
    <div id="header">
        <div id="logos">
            <img src="../img/sarTech.png" alt = "" class="logo">
            <img src="../img/sarTech-short.png" alt = "" class="short-logo">
        </div>
        <ul class="quick-links">
            <li><a href="pages/chi-siamo.html">Chi siamo</a></li>
            <li><a href="pages/contattaci.html">Contattaci</a></li>
        </ul>
    </div>
    <section class="body">
        <nav class="directory-help" id="directoryHelp" aria-label="Percorso di navigazione"></nav>

        <div class="hero-content">
            <h1 class="hero-title" id="heroTitle">Assistenza</h1>
            <p class="hero-sub" id="herosubTitle">Organizza la tua riparazione con noi.</p>
        </div>

        <div class="device-picker" id="devicePicker">

            <div class="picker-row" id="deviceSummaryRow" hidden>
                <button class="picker-toggle" id="deviceSummaryToggle" aria-expanded="false"
                    aria-controls="deviceDetailRows">
                    <span class="label-toggle" id="deviceSummaryLabel">Selezione dispositivo </span>
                    <span class="toggle-chevron">></span>
                </button>
            </div>

            <div id="deviceDetailRows" >
                <div class="picker-row">
                    <button class="picker-toggle" id="typeToggle" aria-expanded="false" aria-controls="typeList">
                        <span class="label-toggle" id="typeLabel">Seleziona il tipo di dispositivo </span>
                        <span class="toggle-chevron">></span>
                    </button>
                    <div class="option-list reveal-in" id="typeList" hidden></div>
                </div>
                <div class="picker-row">
                    <button class="picker-toggle" id="brandToggle" aria-expanded="false" aria-controls="brandList"
                        disabled>
                        <span class="label-toggle" id="brandLabel">Seleziona la marca del dispositivo </span>
                        <span class="toggle-chevron">></span>

                    </button>
                    <div class="option-list reveal-in" id="brandList" hidden></div>
                </div>
                <div class="picker-row">
                    <button class="picker-toggle" id="modelToggle" aria-expanded="false" aria-controls="modelList"
                        disabled>
                        <span class="label-toggle" id="modelLabel">Seleziona il modello del dispositivo </span>
                        <span class="toggle-chevron">></span>
                    </button>
                    <div class="option-list reveal-in" id="modelList" hidden></div>
                </div>
            </div>

            <div class="picker-row">
                <button class="picker-toggle" id="personalToggle" aria-expanded="false" aria-controls="personalFields"
                    disabled>
                    <span class="label-toggle" id="personalLabel">Informazioni personali </span>
                    <span class="toggle-chevron">></span>
                </button>

                <div class="personal-fields" id="personalFields" hidden>
                    <div class="field-group">
                        <label for="inputName">Nome</label>
                        <input type="text" id="inputName" placeholder="..." autocomplete="given-name">
                    </div>

                    <div class="field-group">
                        <label for="inputSurname">Cognome</label>
                        <input type="text" id="inputSurname" placeholder="..." autocomplete="family-name">
                    </div>
                    <div class="field-group">
                        <label for="inputPhone">Telefono</label>
                        <div class = "phone-input-wrap">
                            <span class = "phone-prefix">+39</span>
                            <input type="tel" id="inputPhone" autocomplete="tel" inputmode="numeric" maxlength="10">
                        </div>
                    </div>
                </div>
            </div>

            <button class="device-confirm" id="confirm" disabled>
                <span class = "confirm-label" id = "confirmLabel">Conferma</span>
                <span class="loading-dots" id="loadingDots" hidden>
                    <span></span><span></span><span></span>
                </span>
            </button>

            <div class = "success-panel" id = "successPanel" hidden>
                <svg class = "checkmark" viewBox="0 0 52 52" aria-hidden="true">
                    <circle class = "checkmark-circle" cx="26" cy="26" r="25" fill = "none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
                <p class = "success-title">Richiesta inviata con successo!</p>
                <p class = "success-code">ID richiesta: <strong id = "successCode"></strong> </p>
            </div>

            <div class="error-panel" id="errorPanel" hidden>
                <svg class="error-mark" viewBox="0 0 52 52" aria-hidden="true">
                    <circle class="error-circle" cx="26" cy="26" r="25" fill="none"/>
                    <line class="error-stem" x1="26" y1="15" x2="26" y2="29"/>
                    <circle class="error-dot" cx="26" cy="37" r="2"/>
                    <line></line>
                    <circle></circle>
                </svg>
                <p class="error-title">Si è verificato un errore</p>
                <p class="error-message" id="errorMessage">Controlla la connessione e riprova.</p>
            </div>
        </div>
    </section>
</body>

</html>
